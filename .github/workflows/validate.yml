# Checks the problem data, runs the tests and builds the site on every pull
# request and on every push to main. It only reads the repository: it needs no
# secrets and deploys nothing.

name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate data, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prints errors and warnings as annotations on the pull request.
      - name: Validate problem data
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Build the site
        run: npm run build
